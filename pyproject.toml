[project]
name = "tracklet-tracker"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.15"
dependencies = [
    "duckdb>=2.0.0",
    "fastapi>=0.162.2",
    "numpy>=2.5.4",
    "pandas>=3.1.1",
    "pathlib>=1.0.1",
    "pydantic>=2.14.3",
    "python-multipart>=0.0.33",
    "requests>=2.34.2",
    "scikit-learn>=1.9.1",
    "splink>=5.0.0",
    "streamlit>=1.67.0",
    "uvicorn>=0.54.0",
    "xgboost>=3.4.1",
]

[project.scripts]
tracklet-tracker = "tracklet_tracker:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "black>=26.10.1",
    "matplotlib>=3.11.2",
]
