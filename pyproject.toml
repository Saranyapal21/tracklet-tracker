[project]
name = "tracklet-tracker"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.15"
dependencies = [
    "black>=26.10.1",
    "numpy>=2.5.4",
    "pandas>=3.1.1",
    "pathlib>=1.0.1",
    "scikit-learn>=1.9.1",
]

[project.scripts]
tracklet-tracker = "tracklet_tracker:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"
